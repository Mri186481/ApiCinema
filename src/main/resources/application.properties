spring.application.name=cinemas
# Puerto donde escucha el servidor una vez se inicie
server.port=8080

# Configuracion para el acceso a la Base de Datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true



# Datos de conexion con la base de datos MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/cinemas
spring.datasource.username=cinemas_user
spring.datasource.password=cinemas_password
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE
